agent_patterns:
- patterns/to/your/models
baselines_with_cs:
- baseline: GreedyMaximizer
  cs: TrafficHosted
  threshold: 1000000000000000.0
env_constr: Dynamic_MANETEnv
eval_params:
  allow_early_ep_finish: false
  attackerModel: Static_ClusterJammers
  deterministic: true
  ep_length: 1000
  jammer_ep_steps: 500
  jammersSpawnNextToUsers: false
  n_eval_eps: 30
  networkConnectedAtStart: false
  numbOfJammers: 1
  numbOfUsers:
  - 2
  - 21
  obs_type: real
  render_mode: null
  routing_func: sequential_max_flow
  seed: 22
  state_loss_rate: null
  step_size: 2
  # All-attacks Byzantine node: a single insider node performs all four attacks
  # simultaneously — it drops traffic (greyhole), inflates its reported capacity
  # to attract more traffic (sinkhole), emits interference to degrade neighbours
  # (selective_jamming), and reports a shifted position to the RL agent
  # (position_spoofing).
  numbOfByzantineNodes: 1
  byzantine_attack_type:
  - greyhole
  - sinkhole
  - selective_jamming
  - position_spoofing
  byzantine_drop_rate: 0.5
  byzantine_capacity_inflation_factor: 3.0
  byzantine_jamming_power_factor: 1.5
  byzantine_pos_offset: [50.0, 50.0]
eval_type: grouped_eval
log_dir: out/evaluations/
log_results: true
log_state: true
log_eval: true
mode: evaluate
