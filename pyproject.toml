[project]
name = "manetnodesrelocation"
version = "0.1.0"
description = "A centralized agent is to be trained on a simple model of a MANET which is used by users as a backbone to communicate with each other while a jammer tries to interfere and disrupt the communication and Byzantine nodes may silently drop traffic. The agent's aim is to increase the throughput by relocating the individual MANET nodes."
authors = [
    {name = "silaas",email = "silas.j.leuenberger@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11.0,<3.12.0"
dependencies = [
    "stable-baselines3[extra] (>=2.4.1,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pulp (>=2.9.0,<3.0.0)",
    "xpress (>=9.5.1,<10.0.0)",
    "tk (>=0.1.0,<0.2.0)",
    "networkx (>=3.4.2,<4.0.0)",
    "ipywidgets (>=8.1.5,<9.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "gymnasium (>=1.0.0,<2.0.0)",
    "pyomo (>=6.8.2,<7.0.0)",
    "scipy (>=1.15.1,<2.0.0)",
    "shapely (>=2.0.6,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "gurobipy (>=12.0.0,<13.0.0)",
    "mkdocstrings-python (>=1.16.5,<2.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "jinja2 (>=3.1.5,<4.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocstrings (>=0.29.0,<0.30.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "MANET", from = "src" }, { include = "Utils", from = "src" }, { include = "OptimumFinder", from = "src" }, {include = "src"}]

[tool.poetry.dependencies]
torch = { version = "2.7.1", source = "pytorch_gpu" }
torchvision = { version = "0.22.1", source = "pytorch_gpu" }
torchaudio = { version = "2.7.1", source = "pytorch_gpu" }


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
mkdocs = "^1.6.1"
mkdocstrings-python = "^1.13.0"
mkdocs-material = "^9.5.49"
memory-profiler = "^0.61.0"
pybind11 = "^2.13.6"

[[tool.poetry.source]]
name = "pytorch_gpu"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

